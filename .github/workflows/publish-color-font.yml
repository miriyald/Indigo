name: Publish Telugu Color Font

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build base TTF from UFO source
        run: python tools/tirobuild.py indigo-telugu.yml

      - name: Apply color tables
        run: |
          python tools/colorize.py \
            output/indigo-telugu/TiroTelugu/TTF/TiroTelugu-Regular.ttf \
            --ufo source/TiroTelugu-Regular.ufo \
            -o output/TiroSundaraTelugu-Regular.ttf

      - name: Generate test page
        run: |
          python tools/fonttest.py \
            output/TiroSundaraTelugu-Regular.ttf \
            -o output/index.html \
            --author "Dileep Miriyala" \
            --project-url "https://github.com/miriyald/Indigo" \
            --download-link "TiroSundaraTelugu-Regular.ttf"

      - name: Deploy to gh-pages
        run: |
          mkdir -p _site
          cp output/index.html _site/
          cp output/index.html _site/404.html
          cp output/TiroSundaraTelugu-Regular.ttf _site/
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy color font"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
